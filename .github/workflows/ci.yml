name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  # Integration job (validator-based) also runs nightly and on manual dispatch.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# Read-only token for every job (DEP-15 / least privilege).
permissions:
  contents: read

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Fast gate: the TypeScript SDK. Runs on every push/PR, no Solana toolchain
  # needed. Includes the TS↔Rust parity suite (discriminators + PDA derivation).
  # ---------------------------------------------------------------------------
  sdk:
    name: SDK (build + TS↔Rust parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install SDK deps
        working-directory: sdk
        run: yarn install --frozen-lockfile

      - name: Build SDK (tsc)
        working-directory: sdk
        run: yarn build

      - name: TS↔Rust parity + decoder tests
        working-directory: sdk
        run: yarn test

  # ---------------------------------------------------------------------------
  # Program gate: build the Anchor program and prove the committed SDK IDL still
  # matches it (the Rust side of the parity chain). Heavier — installs the Solana
  # + Anchor toolchain — so it runs on push/PR but is cached.
  # ---------------------------------------------------------------------------
  program:
    name: Program (anchor build + IDL parity)
    runs-on: ubuntu-latest
    env:
      SOLANA_VERSION: "2.2.20"
      # sha256 of solana-release-x86_64-unknown-linux-gnu.tar.bz2 for
      # SOLANA_VERSION, as recorded by GitHub on the anza-xyz/agave release
      # asset (`gh api repos/anza-xyz/agave/releases/tags/v2.2.20`).
      SOLANA_RELEASE_SHA256: "c9b57cc8a36b54c21b5de9f9065217499082446efffe22cb636c58b2858aceaa"
      ANCHOR_VERSION: "0.31.1"
      ANCHOR_REV: "47284f8f0b9844c6b83234aa90f556bad00e12ed" # anchor tag v0.31.1
      RUST_VERSION: "1.95.0" # keep in sync with rust-toolchain.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12 (toolchain given explicitly)
        with:
          toolchain: "1.95.0" # `toolchain` input overrides the @stable ref; matches rust-toolchain.toml
          components: rustfmt, clippy

      - name: Cache cargo + build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Pinned release tarball, checked against a pinned sha256 before use
      # (replaces `curl | sh` of the anza installer, which fetched and ran
      # unverified code). Same tarball agave-install would unpack.
      - name: Install Solana CLI
        run: |
          tarball="$RUNNER_TEMP/solana-release.tar.bz2"
          curl -sSfL --retry 3 -o "$tarball" \
            "https://github.com/anza-xyz/agave/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          echo "${SOLANA_RELEASE_SHA256}  ${tarball}" | sha256sum -c -
          mkdir -p "$HOME/solana-${SOLANA_VERSION}"
          tar -xjf "$tarball" -C "$HOME/solana-${SOLANA_VERSION}"
          echo "$HOME/solana-${SOLANA_VERSION}/solana-release/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/solana-${SOLANA_VERSION}/solana-release/bin:$PATH"
          # Fail loudly (and record the exact toolchain) if the pinned CLI did not
          # install — otherwise anchor silently falls back to its bundled sbf tools
          # (an older rustc that can't compile the current deps).
          solana --version
          cargo-build-sbf --version

      # anchor-cli built from the pinned v0.31.1 commit with its own lockfile
      # (was: avm from the anchor repo's moving HEAD + an unverified binary
      # download). avm is removed first because it owns the `anchor` name.
      - name: Install Anchor (pinned commit, locked)
        run: |
          cargo uninstall avm >/dev/null 2>&1 || true
          cargo install --git https://github.com/coral-xyz/anchor --rev "$ANCHOR_REV" anchor-cli --locked
          anchor --version | grep -F "$ANCHOR_VERSION"

      # Correctness lints only (no formatting gate). Blocking — the tree is
      # clippy-clean as of the mainnet-prep hardening.
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Anchor build (regenerates the IDL)
        run: anchor build

      - name: IDL parity — committed SDK IDL vs built program
        run: node scripts/check-idl-parity.mjs

      # The mainnet artifact is built with `--features mainnet` (different
      # declare_id!). A plain host-target check proves the cfg-gated code still
      # compiles without paying for a second full SBF build. Runs AFTER the IDL
      # parity gate so target/idl always reflects the default (devnet) build.
      - name: cargo check (mainnet feature)
        run: cargo check -p solana-multisig --features mainnet

  # ---------------------------------------------------------------------------
  # Integration: full instruction-flow tests against a local validator. Slow and
  # historically flaky on block-height expiry, so it does NOT gate PRs — it runs
  # nightly and on manual dispatch. `test-reliable` gives each phase a fresh
  # validator. Promote to a required check once it is consistently green.
  # ---------------------------------------------------------------------------
  integration:
    name: Anchor integration (nightly / manual)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SOLANA_VERSION: "2.2.20"
      SOLANA_RELEASE_SHA256: "c9b57cc8a36b54c21b5de9f9065217499082446efffe22cb636c58b2858aceaa"
      ANCHOR_VERSION: "0.31.1"
      ANCHOR_REV: "47284f8f0b9844c6b83234aa90f556bad00e12ed" # anchor tag v0.31.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12 (toolchain given explicitly)
        with:
          toolchain: "1.95.0" # matches rust-toolchain.toml

      - name: Cache cargo + build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Pinned release tarball, checked against a pinned sha256 before use
      # (replaces `curl | sh` of the anza installer, which fetched and ran
      # unverified code). Same tarball agave-install would unpack.
      - name: Install Solana CLI
        run: |
          tarball="$RUNNER_TEMP/solana-release.tar.bz2"
          curl -sSfL --retry 3 -o "$tarball" \
            "https://github.com/anza-xyz/agave/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          echo "${SOLANA_RELEASE_SHA256}  ${tarball}" | sha256sum -c -
          mkdir -p "$HOME/solana-${SOLANA_VERSION}"
          tar -xjf "$tarball" -C "$HOME/solana-${SOLANA_VERSION}"
          echo "$HOME/solana-${SOLANA_VERSION}/solana-release/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/solana-${SOLANA_VERSION}/solana-release/bin:$PATH"
          # Fail loudly (and record the exact toolchain) if the pinned CLI did not
          # install — otherwise anchor silently falls back to its bundled sbf tools
          # (an older rustc that can't compile the current deps).
          solana --version
          cargo-build-sbf --version

      # anchor-cli built from the pinned v0.31.1 commit with its own lockfile
      # (was: avm from the anchor repo's moving HEAD + an unverified binary
      # download). avm is removed first because it owns the `anchor` name.
      - name: Install Anchor (pinned commit, locked)
        run: |
          cargo uninstall avm >/dev/null 2>&1 || true
          cargo install --git https://github.com/coral-xyz/anchor --rev "$ANCHOR_REV" anchor-cli --locked
          anchor --version | grep -F "$ANCHOR_VERSION"

      - name: Generate a local keypair for the validator
        run: solana-keygen new --no-bip39-passphrase --force -o "$HOME/.config/solana/id.json"

      - name: Install JS deps
        run: yarn install --frozen-lockfile

      - name: Anchor integration suite (fresh validator per phase)
        run: anchor run test-reliable
