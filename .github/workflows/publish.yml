name: Publish SDK to npm

# Publishes @runonflux/solana-multisig (sdk/) from CI with npm trusted
# publishing (OIDC) and a signed provenance attestation, so consumers can check
# that a given npm version was built from this repository at a given tag
# (`npm audit signatures`). There is no long-lived npm token anywhere: npm
# exchanges this job's short-lived GitHub OIDC token for a publish credential,
# and only for the repo + workflow file + environment configured as the
# package's trusted publisher on npmjs.com.
#
# Release: bump sdk/package.json "version", merge to master, then push tag
# sdk-vX.Y.Z. (sdk-v* rather than v*: v* tags are program releases and drive
# verifiable-build.yml.)
on:
  push:
    tags: ['sdk-v*']

# Nothing by default; the job below asks for exactly what it needs.
permissions: {}

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: verify, test, build, publish (provenance)
    runs-on: ubuntu-latest
    # Required reviewers + "selected tags: sdk-v*" are configured on this
    # environment in the repo settings; the npm trusted publisher is bound to it.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing + provenance
    defaults:
      run:
        working-directory: sdk
    steps:
      # Third-party actions are pinned to full commit SHAs (tags can be moved).
      # No dependency caches in this job: a release must not restore state
      # written by other workflow runs (cache poisoning).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1. Pinned exactly.
      - name: Pin npm
        run: npm install -g --ignore-scripts npm@11.19.1 && npm --version

      - name: Tag must equal sdk/package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "sdk-v${version}" ]; then
            echo "::error::tag ${TAG} does not match sdk/package.json version ${version}"
            exit 1
          fi

      # Lifecycle scripts of dependencies never run on the release runner.
      - run: yarn install --frozen-lockfile --ignore-scripts
      # Informational: the remaining advisories are transitive (@solana/web3.js
      # ws/uuid/stream-json, anchor toml), not exploitable as the SDK uses them
      # (review DEP-16), and consumers resolve their own versions. Still shown
      # in the run log on every release.
      - name: yarn audit (informational)
        continue-on-error: true
        run: yarn audit --groups dependencies
      - name: Build (tsc + IDL copy)
        run: yarn build
      - name: TS<->Rust parity + decoder tests
        run: yarn test

      # --ignore-scripts: publish exactly the tarball of what was built and
      # tested above (prepublishOnly would only rebuild).
      - name: Stage publish with provenance (maintainer approves on npm)
        # Staged publishing: CI uploads the version (with provenance) but it is
        # NOT live until a maintainer approves it with 2FA on npmjs.com or via
        # `npm stage approve <stage-id>`. The npm trusted publisher is configured
        # without 'Allow npm publish', so a direct `npm publish` would be refused.
        run: npm stage publish --provenance --access public --ignore-scripts
