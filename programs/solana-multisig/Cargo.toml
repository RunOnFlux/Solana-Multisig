[package]
name = "solana-multisig"
version = "0.1.0"
description = "SSP Solana Multisig — self-initiating M-of-N multisig program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solana_multisig"

[features]
default = []
# Mainnet build: swaps declare_id! to the mainnet program address
# (SSPWVu7dtTDkZYmDx73StqV46PioSmdiNE7igpjHK1r). Never on by default —
# devnet/localnet artifacts and the committed SDK IDL use the historical ID.
mainnet = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]


[dependencies]
anchor-lang = "0.31.1"
solana-security-txt = "1.1.2"

[lints.rust]
# Anchor 0.31 macros expand cfg(feature = ...) values this crate never declares
# (anchor-debug, custom-heap, custom-panic, solana). Declaring them via
# check-cfg keeps the lint alive so a typo'd cfg in OUR code still warns.
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic", "solana"))',
  'cfg(target_os, values("solana"))',
] }
# anchor-lang 0.31.1's #[program] expansion calls AccountInfo::realloc, which
# solana-program 2.3 deprecated. None of our own code is deprecated — drop this
# allow when upgrading anchor.
deprecated = "allow"
