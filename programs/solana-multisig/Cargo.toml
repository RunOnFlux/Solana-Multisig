[package]
name = "solana-multisig"
version = "0.1.0"
description = "SSP Solana Multisig — self-initiating M-of-N multisig program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solana_multisig"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]


[dependencies]
anchor-lang = "0.31.1"
solana-security-txt = "1.1.2"
